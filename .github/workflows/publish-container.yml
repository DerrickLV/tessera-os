name: Publish container image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/derricklv/tessera-os
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploying by hand meant copying a SHA between two machines for every change,
  # and the step most often skipped was the one that verified it. This deploys
  # the exact image this run built -- never `latest`, which has already moved by
  # the time anything goes wrong -- and then waits for the app to say it is
  # healthy, so a green run means the change is actually serving traffic.
  #
  # Authentication is OIDC: GitHub presents a short-lived token that Entra
  # exchanges for Azure credentials, scoped by a federated credential to this
  # repository's main branch. No secret is stored in the repository, so there is
  # nothing here to leak or rotate.
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      APP: tessera-portal-api
      GROUP: tessera-pilot-rg
      URL: https://api.tesseraag.com
    steps:
      - name: Sign in to Azure
        # Every other action here is pinned to a commit SHA, and this one should
        # be too. It is on a version tag because the SHA could not be verified
        # when this was written, and a pin nobody has checked is worse than an
        # honest tag: it looks like provenance and is not. To pin it:
        #   gh api repos/Azure/login/commits/v2 --jq .sha
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy this commit's image
        run: |
          set -euo pipefail
          TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          # Revision suffixes must be lowercase alphanumeric and dashes; a git
          # SHA already is, so the tag minus its "sha-" prefix works as-is.
          SUFFIX="${TAG#sha-}"
          REVISION="${APP}--${SUFFIX}"
          echo "Deploying ghcr.io/derricklv/tessera-os:${TAG} as revision ${REVISION}"
          az containerapp update -n "$APP" -g "$GROUP" \
            --image "ghcr.io/derricklv/tessera-os:${TAG}" \
            --revision-suffix "$SUFFIX" --no-wait >/dev/null
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "REVISION=${REVISION}" >> "$GITHUB_ENV"

      - name: Wait for the revision to become healthy
        run: |
          set -euo pipefail
          # --no-wait returns as soon as Azure accepts the update request --
          # before the new revision exists at all. Polling "whichever revision
          # currently holds 100% traffic" (the old query here) then matches
          # the PREVIOUS revision, which is already Running at 100%, and this
          # step exits successfully on its very first poll without the new
          # image ever having deployed: a green run that deployed nothing.
          # The poll must therefore be pinned to this run's own revision name
          # (a name Azure will only ever attach to the image built above) and
          # require 100% traffic on that exact name -- never "any revision
          # that looks healthy". Do not simplify this back.
          seen=false
          for attempt in $(seq 1 30); do
            REV_JSON=$(az containerapp revision list -n "$APP" -g "$GROUP" \
              --query "[?name=='${REVISION}'] | [0]" -o json 2>/dev/null || echo "")
            if [ -n "$REV_JSON" ] && [ "$REV_JSON" != "null" ]; then
              seen=true
              STATE=$(echo "$REV_JSON" | jq -r '.properties.runningState // empty')
              WEIGHT=$(echo "$REV_JSON" | jq -r '.properties.trafficWeight // 0')
              echo "attempt ${attempt}: ${REVISION} state=${STATE:-pending} traffic=${WEIGHT}"
              if [ "$STATE" = "Failed" ]; then
                echo "::error::Revision ${REVISION} failed to start"
                exit 1
              fi
              if { [ "$STATE" = "Running" ] || [ "$STATE" = "RunningAtMaxScale" ]; } \
                  && [ "$WEIGHT" = "100" ]; then
                echo "revision ${REVISION} is running at 100% traffic"
                exit 0
              fi
            else
              echo "attempt ${attempt}: ${REVISION} does not exist yet"
            fi
            sleep 10
          done
          if [ "$seen" = false ]; then
            echo "::error::Revision ${REVISION} was never created"
          else
            echo "::error::Revision ${REVISION} did not reach 100% traffic within five minutes"
          fi
          exit 1

      - name: Check the application answers, and answers completely
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "${URL}/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"' || { echo "::error::Portal unhealthy"; exit 1; }
          # A portal serving with no console is a degraded deployment, not a
          # successful one. It was invisible for an evening precisely because
          # nothing failed loudly when it happened.
          if ! echo "$BODY" | grep -q '"console":"ok"'; then
            echo "::error::Portal is up but the console did not mount. Check the container logs."
            exit 1
          fi

      - name: Report
        run: echo "### Deployed \`${TAG}\` — portal and console healthy" >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back on failure
        if: failure()
        run: |
          echo "::warning::Deployment of ${TAG:-this build} did not become healthy."
          echo "The previous revision continues to serve traffic; nothing is down."
          echo "To roll the image back explicitly:"
          echo "  az containerapp update -n $APP -g $GROUP --image ghcr.io/derricklv/tessera-os:sha-<last-good>"
