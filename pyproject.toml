[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tessera-os"
version = "0.9.0"
description = "Policy-aware multi-agent operating system for Tessera"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50.0.0,<51",
  "fastapi>=0.116,<1",
  "msal>=1.34,<2",
  "openai-agents>=0.8,<1",
  "pydantic>=2.8,<3",
  "python-docx>=1.2,<2",
  "PyJWT[crypto]>=2.10.1,<3",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.16,<1",
]

[project.scripts]
tessera = "tessera_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
