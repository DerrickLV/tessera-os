[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tessera-os"
version = "0.3.0"
description = "Policy-aware multi-agent operating system for Tessera"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.8,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
tessera = "tessera_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Temporary migration guard for the two duplicate folders in the existing GitHub repo.
extend-exclude = ["tessera-os-starter", "tessera-os-phase2-github"]
