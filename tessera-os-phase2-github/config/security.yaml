defaults:
  tool_access: deny
  external_writes: require_approval
  destructive_actions: require_approval
  cross_project_retrieval: deny
  pii_logging: redact
approval_tiers:
  none: [read, search, summarize, draft]
  manager: [send_message, update_crm, create_task, publish_document]
  executive: [execute_contract, move_funds, submit_filing, delete_record]
retention:
  raw_prompt_days: 30
  audit_event_days: 2555
  generated_artifact_days: 365
