# Tessera adopted positions — the ledger that turns a starting point into a
# firm position.
#
# This file ships EMPTY. Until an entry is signed here, every structural
# position the engine produces is labelled a starting point or a synthetic
# reference, and every memo says so. That is deliberate: the system never
# claims a Tessera standard that Derrick and Ryan have not actually adopted.
#
# Rules, enforced by the loader (src/tessera_os/adoption.py):
#   - adopted_by needs TWO distinct partners and approval_ref must identify the
#     protected pull request both partners approved. Typed names are not signatures.
#   - source_ref is a citation BY REFERENCE (document name + section). Never
#     paste agreement text into this repository.
#   - counsel_reviewed stays false until qualified counsel has reviewed the
#     position for the jurisdictions Tessera works in.
#   - The `area` must match a Recommendation area exactly (see
#     docs/governance/02_DECISION_RULES.md for the list).
#
# A ready-to-review proposal for every area is in
# docs/governance/09_DECISION_PACKET.md. Adoption requires a protected pull
# request approved independently by both partners.
#
# Example (leave commented until actually decided):
#
# positions:
#   - area: "Ordinary-course authority"
#     adopted_by: ["Derrick Carlisle", "Ryan Strasshofer"]
#     date: "2026-08-19"
#     source_ref: "Tesserra Holdings LLC Operating Agreement, Art. IV"
#     approval_ref: "https://github.com/DerrickLV/tessera-os/pull/NNN"
#     counsel_reviewed: false
#     note: "Threshold set per the adopted scaling rule."

positions: []
